<!DOCTYPE html>
<html lang="en-us"><head>
<title>REGISTER | StumbleChat.com (fixture)</title>
<meta name="viewport" content="width=device-width,minimum-scale=1,initial-scale=1,user-scalable=0">
<meta charset="UTF-8">
<link type="text/css" rel="stylesheet" href="../styles/home.css">
<script src="../../harness.js"></script>
</head>
<body>
    <nav class="navbar">
	<div class="container-fluid">
		<a class="navbar-brand" href="/" title="StumbleChat Home">StumbleChat</a>
		<ul class="navbar-nav">
			<a class="nav-link" title="StumbleChat Home" href="/">Home</a>
			<a class="nav-link" href="/login" title="StumbleChat Login">Login</a>
			<a class="nav-link" href="/register" title="StumbleChat Register">Register</a>
            </ul>
	</div>
</nav>

    <div class="content">
      <div id="error">
        <h1></h1>
      </div>
      <div class="login-form">
        <h1>Registration Form</h1>
        <form name="Auth" onsubmit="return false">
          <div class="field-inline-block">
            <label>DD</label>
            <input type="text" name="day" id="day" pattern="^0?[1-9]|1[0-9]|2[0-9]|3[0-1]$" minlength="1" maxlength="2" size="2" class="date-field" required="">
          </div>
          <div class="field-inline-block">
            <label>MM</label>
            <input type="text" name="month" id="month" pattern="^0[1-9]|1[0-2]$" minlength="1" maxlength="2" size="2" class="date-field" required="">
          </div>
          <div class="field-inline-block">
            <label>YYYY</label>
            <input type="text" name="year" id="year" pattern="^((?:19|20)[0-9]{2})$" maxlength="4" size="4" class="date-field date-field--year" required="">
          </div>
          <br><br>
          <label for="user">Username:</label>
          <input type="text" name="user" id="user" placeholder="Username" autocomplete="on" required="" minlength="3" maxlength="24" pattern="[a-zA-Z0-9]{3,24}" title="Three or more characters">
          <label for="email">Email Address:</label>
          <input type="email" name="email" id="email" placeholder="email" required="" autocomplete="on">
          <label for="password">Password:</label>
          <input type="password" name="password" id="password" placeholder="Password" required="" minlength="8" maxlength="128" title="Eight or more characters" autocomplete="off">
          <label for="password">Confirm Password:</label>
          <input type="password" name="confirm" id="confirm" placeholder="Confirm Password" required="" minlength="8" maxlength="128" title="Eight or more characters" autocomplete="off">
          <label>
            Stumblechat has a strict policy regarding copyright violation, items
            you can find in the
            <a href="/terms" class="link2">terms of use</a>. If you do
            not follow the terms, you will be banned from the site. By
            registering on stumblechat.com you automatically agree to the
            <a href="/terms" class="link2">terms of use</a>. </label><br><br>
          <input type="submit" id="register" value="Sign Up">
          <br><br>
          <label>Already signed up? <a class="link2" style="text-decoration:none;" href="/login">Log in here!</a></label>
        </form>
      </div>
    </div>
    <div class="footer">
    <p>
        <a class="footer-link" href="/">Home</a> |
        <a class="footer-link" href="contact">Support</a> |
	<a class="footer-link" href="https://www.gofundme.com/f/stumblechat">Donate</a> |
        <a class="footer-link" href="privacy">Privacy Policy</a> |
        <a class="footer-link" href="terms">Terms Of Service</a>
    </p>
    <p>Copyright © 2026 StumbleChat. All Rights Reserved.</p>
</div>
</body></html>
